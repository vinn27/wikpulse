name: keepalive

# GitHub disables scheduled workflows after 60 days without a repo commit.
# This monthly no-op keeps the cron schedule alive so the pipeline (and the
# dashboard built on it) never silently dies.

on:
  schedule:
    - cron: "0 4 1 * *" # 1st of every month
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: gastonpelletier/keepalive-workflow@v1
