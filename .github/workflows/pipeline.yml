name: pipeline

on:
  schedule:
    # backup trigger — GitHub's scheduler drops most runs at high load;
    # the primary trigger is repository_dispatch from an external heartbeat
    # (cron-job.org -> GitHub API). Cadence moved 10 min -> 30 min: each run
    # wakes the Neon compute for ~5 min (autosuspend), so 144 runs/day burned
    # ~13 compute-hours/day and blew the free-tier quota in under a week.
    # 1-minute aggregation windows are unchanged — a run just covers 30 min
    # of events at once.
    - cron: "7,37 * * * *"
  repository_dispatch:
    types: [tick] # external heartbeat (set cron-job.org to every 30 min too!)
  workflow_dispatch: # manual "Run workflow" button

concurrency:
  group: wikpulse-pipeline
  cancel-in-progress: false # queue rather than kill a mid-run job

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11" # officially supported by pyspark 3.5.x
          cache: pip

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Produce (Wikipedia -> Redpanda)
        env:
          REDPANDA_BROKER: ${{ secrets.REDPANDA_BROKER }}
          REDPANDA_USER: ${{ secrets.REDPANDA_USER }}
          REDPANDA_PASSWORD: ${{ secrets.REDPANDA_PASSWORD }}
          LOOKBACK_MIN: "35" # > 30-min cadence: overlap covers delays/gaps; rcid dedup absorbs duplicates
        run: python src/producer.py

      - name: Aggregate (Redpanda -> PySpark -> Neon)
        env:
          REDPANDA_BROKER: ${{ secrets.REDPANDA_BROKER }}
          REDPANDA_USER: ${{ secrets.REDPANDA_USER }}
          REDPANDA_PASSWORD: ${{ secrets.REDPANDA_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python src/aggregator.py
