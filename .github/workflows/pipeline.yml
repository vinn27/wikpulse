name: pipeline

on:
  schedule:
    # backup trigger — GitHub's scheduler drops most runs at high load;
    # the primary trigger is repository_dispatch from an external heartbeat
    # (cron-job.org -> GitHub API every 10 min)
    - cron: "7,17,27,37,47,57 * * * *"
  repository_dispatch:
    types: [tick] # external heartbeat - reliable 10-min cadence
  workflow_dispatch: # manual "Run workflow" button

concurrency:
  group: wikpulse-pipeline
  cancel-in-progress: false # queue rather than kill a mid-run job

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11" # officially supported by pyspark 3.5.x
          cache: pip

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Produce (Wikipedia -> Redpanda)
        env:
          REDPANDA_BROKER: ${{ secrets.REDPANDA_BROKER }}
          REDPANDA_USER: ${{ secrets.REDPANDA_USER }}
          REDPANDA_PASSWORD: ${{ secrets.REDPANDA_PASSWORD }}
          LOOKBACK_MIN: "15" # > cron interval: overlap covers GitHub cron delays; rcid dedup absorbs duplicates
        run: python src/producer.py

      - name: Aggregate (Redpanda -> PySpark -> Neon)
        env:
          REDPANDA_BROKER: ${{ secrets.REDPANDA_BROKER }}
          REDPANDA_USER: ${{ secrets.REDPANDA_USER }}
          REDPANDA_PASSWORD: ${{ secrets.REDPANDA_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python src/aggregator.py
